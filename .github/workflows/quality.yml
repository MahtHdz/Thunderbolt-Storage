name: Quality
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.25.x', stable]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal)"
      - run: go vet ./...
      - run: go test -race -timeout 3m -coverprofile=coverage.out ./...
      - name: Coverage floor
        shell: bash
        # Windows includes additional OS adapters; retain a separate floor.
        run: |
          minimum=90
          if [ "$RUNNER_OS" = Windows ]; then minimum=85; fi
          go tool cover -func=coverage.out
          go tool cover -func=coverage.out | awk -v minimum="$minimum" '/^total:/ { sub(/%/, "", $3); if ($3+0 < minimum) exit 1; found=1 } END { if (!found) exit 1 }'
      - run: go build -trimpath ./cmd/storage-cli
  fuzz-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false
      - run: make fuzz FUZZTIME=15s
      - run: make vuln
